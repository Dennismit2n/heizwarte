<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heizwarte</title>
<meta name="description" content="Sagt dir, wann du die Heizung hochstellen musst. Werbefrei, ohne Konto.">
<meta name="theme-color" content="#111821">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://api.open-meteo.com https://api.brightsky.dev https://photon.komoot.io; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./css/style.css?v=2026-10-12">
<script src="./js/boot.js?v=2026-10-12"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="appName">Heizwarte</h1>
  </header>
  <main>
    <section class="screen" id="s-welcome" hidden>
      <h2 tabindex="-1" data-i18n="appClaim"></h2>
    </section>
    <section class="screen" id="s-address" hidden>
      <h2 tabindex="-1" data-i18n="setupAddressTitle"></h2>
    </section>
    <section class="screen" id="s-hits" hidden>
      <h2 tabindex="-1" data-i18n="setupHitsTitle"></h2>
    </section>
    <section class="screen" id="s-confirm" hidden>
      <h2 tabindex="-1" data-i18n="setupConfirmTitle"></h2>
    </section>
    <section class="screen" id="s-profile" hidden>
      <h2 tabindex="-1" data-i18n="setupHeatTitle"></h2>
    </section>
    <section class="screen" id="s-main" hidden>
      <section id="now">
        <h2 tabindex="-1" data-i18n="nowTitle"></h2>
      </section>
    </section>
    <section class="screen" id="s-settings" hidden>
      <h2 tabindex="-1" data-i18n="settingsTitle"></h2>
    </section>
  </main>
</div>
<script src="./js/storage.js?v=2026-10-12"></script>
<script src="./js/i18n.js?v=2026-10-12"></script>
<script src="./js/geo.js?v=2026-10-12"></script>
<script src="./js/weather.js?v=2026-10-12"></script>
<script src="./js/heat.js?v=2026-10-12"></script>
<script src="./js/chart.js?v=2026-10-12"></script>
<script src="./js/app.js?v=2026-10-12"></script>
</body>
</html>
